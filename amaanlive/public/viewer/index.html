<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>البث المباشر</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="viewer.css">
</head>
<body>

<div class="ticker-bar hidden" id="tickerBar">
  <span class="ticker-label">إعلان</span>
  <div class="ticker-track"><span id="tickerText"></span></div>
</div>

<header class="site-head">
  <img id="siteLogo" class="site-logo hidden" alt="">
  <h1 id="siteTitle">البث المباشر</h1>
  <a id="sitePhone" class="site-phone hidden" href="#"></a>
</header>

<!-- ===== المشغّل ===== -->
<section id="playerSection" class="player-section hidden">
  <div class="player-shell">
    <video id="video" playsinline controls></video>
    <div class="player-loading" id="playerLoading">
      <div class="pl-spinner" aria-hidden="true"></div>
      <div class="pl-text">جاري تجهيز البث...</div>
    </div>
    <div class="player-status hidden" id="playerStatus">
      <div class="ps-icon" id="psIcon">⏸</div>
      <div class="ps-title" id="psTitle"></div>
      <div class="ps-sub" id="psSub"></div>
    </div>
    <div class="player-bar">
      <div class="np">
        <span class="np-live" id="npLive">● مباشر</span>
        <span id="npName"></span>
      </div>
      <div class="player-controls">
        <label class="cpu-saver" title="يقلل استهلاك المعالج في المتصفح">
          <input type="checkbox" id="cpuSaver"> توفير المعالج
        </label>
        <button class="pbtn" id="refreshBtn" title="تحديث القناة">↻ تحديث</button>
        <button class="pbtn" id="muteBtn">🔊</button>
        <button class="pbtn" id="fsBtn">⛶</button>
        <button class="pbtn" id="closePlayer">✕</button>
      </div>
    </div>
    <div class="player-msg hidden" id="playerMsg"></div>
  </div>
</section>

<!-- ===== القنوات ===== -->
<main class="container">
  <div class="cat-filters" id="catFilters"></div>
  <div class="grid" id="channelGrid"></div>
  <p id="emptyMsg" class="empty hidden">لا توجد قنوات متاحة حالياً.</p>
</main>

<footer class="site-foot">
  <span>© <span id="footYear"></span> — بثي المحلي</span>
</footer>

<!-- hls.js من الموارد المحلية فقط: لا CDN ولا إنترنت -->
<script src="/vendor/hls.min.js"></script>
<script src="viewer.js"></script>
</body>
</html>
