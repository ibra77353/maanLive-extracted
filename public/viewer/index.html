<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أمان لايف — البث المباشر</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="viewer.css">
</head>
<body>

<div class="ticker-bar hidden" id="tickerBar">
  <span class="ticker-label" id="tickerLabel">أخبار</span>
  <div class="ticker-track"><span id="tickerText"></span></div>
</div>

<header class="site-head">
  <img id="siteLogo" class="site-logo hidden" alt="">
  <h1 id="siteTitle">أمان لايف</h1>
  <a id="sitePhone" class="site-phone" href="#"></a>
  <div id="promoTextBar" class="promo-bar hidden"><div class="promo-track"><span id="promoTextContent"></span></div></div>
  <div id="promoSliderTop" class="promo-box hidden"></div>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="channels">القنوات</button>
    <button class="tab hidden" data-tab="matches" id="matchesTab">مباريات اليوم 🏆</button>
  </nav>
</header>

<!-- ===== Player ===== -->
<section id="playerSection" class="player-section hidden">
  <div class="player-shell">
    <video id="video" playsinline></video>
    <div class="player-loading" id="playerLoading">
      <div class="pl-spinner" aria-hidden="true"></div>
      <div class="pl-text">جاري تجهيز البث...</div>
    </div>
    <div class="player-status hidden" id="playerStatus">
      <div class="ps-icon" id="psIcon">⏸</div>
      <div class="ps-title" id="psTitle"></div>
      <div class="ps-sub" id="psSub"></div>
    </div>
    <div class="player-bar">
      <div class="np">
        <span class="np-live" id="npLive">● مباشر</span>
        <span id="npName"></span>
      </div>
      <div class="player-controls">
        <label class="cpu-saver" title="يقلل استهلاك المعالج في المتصفح">
          <input type="checkbox" id="cpuSaver"> توفير المعالج
        </label>
        <button class="pbtn pbtn-refresh" id="refreshBtn" title="تحديث القناة">↻ تحديث</button>
        <button class="pbtn" id="muteBtn">🔊</button>
        <button class="pbtn" id="fsBtn">⛶</button>
        <button class="pbtn" id="closePlayer">✕</button>
      </div>
    </div>
    <div class="player-msg hidden" id="playerMsg"></div>
  </div>
</section>

<!-- ===== Channels grid ===== -->
<main id="tab-channels" class="container">
  <div class="cat-filters" id="catFilters"></div>
  <div class="grid" id="channelGrid"></div>
  <div id="promoSliderBottom" class="promo-box hidden"></div>
  <p id="emptyMsg" class="empty hidden">لا توجد قنوات متاحة حالياً.</p>
</main>

<!-- ===== World Cup: today matches ===== -->
<main id="tab-matches" class="container hidden">
  <!-- صفحة كأس العالم 2026 الكاملة (تُفعّل من لوحة التحكم) -->
  <div id="wcFullWrap" class="hidden">
    <iframe id="wcFrame" title="كأس العالم 2026"></iframe>
  </div>
  <!-- الوضع المبسّط القديم (مباريات يدوية) -->
  <div id="wcSimple">
    <h2 class="wc-title">🏆 مباريات اليوم — كأس العالم 2026</h2>
    <p class="wc-sub">جميع الأوقات بتوقيت الرياض (UTC+3)</p>
    <div id="matchesList" class="matches"></div>
    <h3 class="wc-news-title">آخر الأخبار</h3>
    <ul id="wcNews" class="wc-news"></ul>
  </div>
</main>

<footer class="site-foot" id="siteFooter">
  <span class="foot-copy">جميع الحقوق محفوظة ©</span>
  <a class="foot-brand" href="https://www.facebook.com/AmaanTelcom/" target="_blank" rel="noopener">أمان تيليكوم للخدمات التقنية</a>
</footer>

<script>
// load hls.js from local vendor first (LAN without internet), then CDN fallback
(function () {
  var s = document.createElement('script');
  s.src = '/vendor/hls.min.js';
  s.onload = function () { window._hlsReady && window._hlsReady(); };
  s.onerror = function () {
    var c = document.createElement('script');
    c.src = 'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js';
    c.onload = function () { window._hlsReady && window._hlsReady(); };
    document.head.appendChild(c);
  };
  document.head.appendChild(s);
})();
</script>
<script src="viewer.js"></script>
</body>
</html>
